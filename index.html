<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titus Token Bányászat</title>
    <!-- AdsGram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            font-size: 20px;
            color: #fbbf24;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .coin-box {
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.3);
        }
        .coin-text {
            font-weight: bold;
            font-size: 18px;
            color: #1e1b4b;
        }
        .balance-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .balance-value {
            font-size: 24px;
            font-weight: bold;
            color: #fbbf24;
        }
        .action-btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-green { background: #10b981; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-orange { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .action-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="container">
        <h1>TITUS TOKEN BÁNYÁSZAT</h1>
        
        <div class="coin-box">
            <div style="font-size: 24px;">👑</div>
            <div class="coin-text">TITUS</div>
            <div style="font-size: 10px; color: #1e1b4b;">PREMIUM DIGITAL ASSET</div>
        </div>

        <div class="balance-card">
            <div style="font-size: 12px; color: #94a3b8;">AKTUÁLIS EGYENLEG:</div>
            <div class="balance-value" id="balance">0 TITUS</div>
        </div>

        <!-- Alapműveleti gombok -->
        <button class="action-btn btn-green" id="startMining">⛏️ Bányászat Indítása</button>
        <button class="action-btn btn-red" id="stopMining">⏹️ Bányászat Leállítása</button>
        
        <!-- Verseny / Extra Videó Gomb AdsGram integrációval -->
        <button class="action-btn btn-orange" id="extraVideoBtn">🎬 Plusz Videó (Verseny)</button>
        
        <button class="action-btn btn-blue" id="claimBtn">💰 Kifizetés Igénylése</button>
    </div>

    <script>
        // Alap egyenleg kezelés
        let userBalance = 0;
        const balanceDisplay = document.getElementById('balance');

        document.getElementById('startMining').addEventListener('click', () => {
            alert("Bányászat elindítva, Tito!");
        });

        document.getElementById('stopMining').addEventListener('click', () => {
            alert("Bányászat leállítva.");
        });

        document.getElementById('claimBtn').addEventListener('click', () => {
            alert("Kifizetés igénylése elküldve!");
        });

        // AdsGram Extra Videó / Verseny Logika
        document.getElementById('extraVideoBtn').addEventListener('click', () => {
            // Itt adhatod meg az AdsGram Block ID-dat, amit a vezérlőpultban kaptál
            const blockId = "itt_a_te_block_id_d"; 

            if (window.Adsgram) {
                const adController = window.Adsgram.init({ blockId: blockId });
                
                adController.show().then(() => {
                    // Sikeres megtekintés
                    userBalance += 10; // Például 10 token jár érte
                    balanceDisplay.innerText = userBalance + " TITUS";
                    alert("Sikeres videó megtekintés! Pontod rögzítve a versenyben.");
                }).catch((result) => {
                    // Megszakított hirdetés
                    console.log("Hirdetés megszakítva:", result);
                    alert("A hirdetés nem lett végignézve.");
                });
            } else {
                alert("Az AdsGram hirdetési rendszer még töltődik.");
            }
        });
    </script>
</body>
</html>
