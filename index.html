<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titus Token Auto-Claim & Verseny</title>
    <!-- AdsGram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        h1 {
            font-size: 20px;
            color: #fbbf24;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .coin-box {
            width: 130px;
            height: 130px;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(251, 191, 36, 0.3);
        }
        .coin-text {
            font-weight: bold;
            font-size: 16px;
            color: #1e1b4b;
        }
        .balance-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .balance-value {
            font-size: 24px;
            font-weight: bold;
            color: #fbbf24;
        }
        .status-box {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 15px;
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            text-align: left;
        }
        .action-btn {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-autoclaim { background: linear-gradient(135deg, #10b981, #047857); color: white; }
        .btn-extra { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; }
        .btn-blue { background: #3b82f6; color: white; }
        .action-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <div class="container">
        <h1>TITUS TOKEN RENDSZER</h1>
        
        <div class="coin-box">
            <div style="font-size: 22px;">⚡</div>
            <div class="coin-text">AUTO-CLAIM</div>
            <div style="font-size: 9px; color: #1e1b4b;">24 ÓRÁS RENDSZER</div>
        </div>

        <div class="balance-card">
            <div style="font-size: 12px; color: #94a3b8;">AKTUÁLIS EGYENLEG:</div>
            <div class="balance-value" id="balance">0 TITUS</div>
        </div>

        <div class="status-box" id="autoClaimStatus">
            Állapot: 🔴 Nem aktív (Nézz meg 5 videót az aktiváláshoz: 0/5)
        </div>

        <!-- 24 órás Auto-Claim aktiválása (5 videó megtekintésével) -->
        <button class="action-btn btn-autoclaim" id="autoClaimVideoBtn">
            ⚡ 24h Auto-Claim Videó (0/5)
        </button>
        
        <!-- Extra Videó Verseny Gomb -->
        <button class="action-btn btn-extra" id="extraVideoBtn">
            🎬 Extra Videó (Verseny Főnyereményért)
        </button>
        
        <button class="action-btn btn-blue" id="claimBtn">
            💰 Kifizetés Igénylése
        </button>
    </div>

    <script>
        let userBalance = 0;
        let watchedAutoClaimVideos = parseInt(localStorage.getItem('watchedAutoClaimVideos')) || 0;
        
        const balanceDisplay = document.getElementById('balance');
        const autoClaimStatus = document.getElementById('autoClaimStatus');
        const autoClaimVideoBtn = document.getElementById('autoClaimVideoBtn');

        function updateUIState() {
            const expiry = localStorage.getItem('autoClaimExpiry');
            const now = Date.now();

            if (expiry && now < expiry) {
                const remainingHours = Math.ceil((expiry - now) / (1000 * 60 * 60));
                autoClaimStatus.innerHTML = `🟢 <b>Auto-Claim Aktív!</b><br>Hátralévő idő: ${remainingHours} óra`;
                autoClaimVideoBtn.innerText = "⚡ Auto-Claim Már Működik";
                autoClaimVideoBtn.style.opacity = "0.6";
            } else {
                autoClaimStatus.innerHTML = `🔴 <b>Auto-Claim Nem Aktív</b><br>Megtekintett videók: ${watchedAutoClaimVideos}/5 (24 órához)`;
                autoClaimVideoBtn.innerText = `⚡ 24h Auto-Claim Videó (${watchedAutoClaimVideos}/5)`;
                autoClaimVideoBtn.style.opacity = "1";
            }
        }

        updateUIState();

        // AdsGram Block ID (írd be a sajátod a helyére)
        const adsgramBlockId = "itt_a_te_block_id_d";

        // 1. Auto-Claim videók gyűjtése (5 db kell a 24 órához)
        autoClaimVideoBtn.addEventListener('click', () => {
            const expiry = localStorage.getItem('autoClaimExpiry');
            if (expiry && Date.now() < expiry) {
                alert("A 24 órás auto-claim már aktív!");
                return;
            }

            if (window.Adsgram) {
                const adController = window.Adsgram.init({ blockId: adsgramBlockId });
                
                adController.show().then(() => {
                    watchedAutoClaimVideos++;
                    localStorage.setItem('watchedAutoClaimVideos', watchedAutoClaimVideos);

                    if (watchedAutoClaimVideos >= 5) {
                        const expiryTime = Date.now() + (24 * 60 * 60 * 1000);
                        localStorage.setItem('autoClaimExpiry', expiryTime);
                        watchedAutoClaimVideos = 0;
                        localStorage.setItem('watchedAutoClaimVideos', 0);
                        alert("Gratulálok, Tito! Teljesítetted az 5 videót, a 24 órás Auto-Claim aktiválva!");
                    } else {
                        alert(`Videó sikeresen megtekintve! (${watchedAutoClaimVideos}/5)`);
                    }
                    updateUIState();
                }).catch((result) => {
                    console.log("Hirdetés megszakítva:", result);
                    alert("A hirdetés nem lett végignézve.");
                });
            } else {
                alert("Az AdsGram hirdetési rendszer még töltődik.");
            }
        });

        // 2. Extra Videó Verseny Gomb
        document.getElementById('extraVideoBtn').addEventListener('click', () => {
            if (window.Adsgram) {
                const adController = window.Adsgram.init({ blockId: adsgramBlockId });
                
                adController.show().then(() => {
                    userBalance += 10;
                    balanceDisplay.innerText = userBalance + " TITUS";
                    alert("Sikeres extra videó, Tito! Pontod rögzítve a verseny ranglistáján.");
                }).catch((result) => {
                    console.log("Hirdetés megszakítva:", result);
                    alert("A hirdetés nem lett végignézve.");
                });
            } else {
                alert("Az AdsGram hirdetési rendszer még töltődik.");
            }
        });

        document.getElementById('claimBtn').addEventListener('click', () => {
            alert("Kifizetés igénylése elküldve, Tito!");
        });
    </script>
</body>
</html>
