<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titus Token Premium</title>
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --gold: #d4af37;
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-light: #ffffff;
            --text-grey: #a0a0a0;
        }
        body { margin: 0; background-color: var(--bg); color: var(--text-light); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; min-height: 100vh; }
        .app { width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; text-align: center; }
        
        .coin-container { perspective: 1000px; width: 140px; height: 140px; margin: 10px auto 15px auto; }
        .coin-3d { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; animation: slowSpin 10s infinite linear; }
        @keyframes slowSpin { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(360deg); } }
        .coin-face { position: absolute; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 4px solid var(--gold); box-shadow: 0 0 25px rgba(212, 175, 55, 0.6); backface-visibility: hidden; background: #1a1a1a; }
        .coin-face img { width: 100%; height: 100%; object-fit: cover; }
        .coin-back { transform: rotateY(180deg); }

        h1 { font-size: 18px; color: var(--gold); margin: 5px 0 2px 0; letter-spacing: 1px; }
        .token-info-sub { font-size: 10px; color: var(--text-grey); margin-bottom: 15px; background: var(--card-bg); padding: 5px; border-radius: 6px; border: 1px solid #333; display: inline-block; width: 100%; box-sizing: border-box; }
        .token-info-sub span { color: var(--gold); cursor: pointer; font-family: monospace; }
        
        .balance-box { background: var(--card-bg); padding: 12px; border-radius: 12px; margin: 10px 0; border: 1px solid #333; }
        .balance-val { font-size: 22px; font-weight: bold; color: var(--gold); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); padding: 8px 4px; border-radius: 8px; border: 1px solid #333; font-size: 9px; color: var(--text-grey); }
        .stat-val { color: var(--gold); font-weight: bold; display: block; font-size: 11px; margin-top: 2px; }

        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn { padding: 10px 5px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.2s; }
        .btn-green { background: #1a4731; color: #4ade80; border: 1px solid #4ade80; }
        .btn-red { background: #471a1a; color: #f87171; border: 1px solid #f87171; }
        .btn-blue { background: #1e3a8a; color: #60a5fa; border: 1px solid #60a5fa; }
        .btn-gold { background: #5a420b; color: var(--gold); border: 1px solid var(--gold); }
        .btn-grey { background: #333; color: #ccc; border: 1px solid #555; }
        .btn:active { transform: scale(0.95); }

        .footer { margin-top: 20px; font-size: 10px; color: #555; }
        .footer a { color: #777; margin: 0 5px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="app">
        <h1>TITUS TOKEN BÁNYÁSZAT</h1>
        <div class="token-info-sub">
            Contract: <span id="contractAddr" title="Kattints a másoláshoz">ITT_A_VALOS_TOKEN_SZERZODESE</span>
        </div>
        
        <div class="coin-container">
            <div class="coin-3d">
                <div class="coin-face"><img src="logo.png" alt="Titus Logo"></div>
                <div class="coin-face coin-back"><img src="logo.png" alt="Titus Logo"></div>
            </div>
        </div>

        <div class="balance-box">
            <div style="font-size: 11px; color: var(--text-grey);">AKTUÁLIS EGYENLEG:</div>
            <div class="balance-val" id="balance">0 TITUS</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">Auto-Claim<span class="stat-val" id="dailyProd">0/5</span></div>
            <div class="stat-card">Extra Videó<span class="stat-val" id="extraCountText">0</span></div>
            <div class="stat-card">Meghívás<span class="stat-val" id="referCountText">0</span></div>
        </div>

        <div class="btn-grid">
            <button class="btn btn-green" id="startBtn">⛏️ AUTO-CLAIM</button>
            <button class="btn btn-red" id="stopBtn">⏹️ LEÁLLÍT</button>
            <button class="btn btn-blue" id="claimBtn">💰 KIFIZETÉS</button>
            <button class="btn btn-grey" id="extraBtn">🎬 EXTRA VIDEÓ</button>
            <button class="btn-gold btn" id="referBtn">🤝 BARÁT MEGHÍVÁSA</button>
            <button class="btn btn-grey" id="infoStatusBtn">ℹ️ STÁTUSZ & INFÓ</button>
            <button class="btn btn-grey" id="settingsBtn">⚙️ BEÁLLÍTÁSOK</button>
            <button class="btn btn-grey" onclick="location.reload()">🔄 FRISSÍT</button>
        </div>

        <div class="footer">
            <a href="#" id="privacyBtn">Privacy Policy</a> | <a href="#" id="termsBtn">Terms of Service</a>
        </div>
    </div>

    <!-- Modal Ablak -->
    <div id="legalModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; justify-content:center; align-items:center;">
        <div style="background:#1a1a1a; padding:20px; width:85%; border-radius:10px; text-align:left; border: 1px solid #333; max-height: 80vh; overflow-y: auto;">
            <h2 id="mTitle" style="color:var(--gold); margin-top:0;"></h2>
            <div id="mText" style="font-size:12px; color:#ccc; line-height: 1.5;"></div>
            <button onclick="document.getElementById('legalModal').style.display='none'" style="width:100%; padding:10px; background:var(--gold); border:none; border-radius:5px; margin-top:15px; font-weight:bold;">Bezárás</button>
        </div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        const userId = window.Telegram.WebApp.initDataUnsafe.user?.id || "TESZT_USER";
        const botUsername = "TitusToken_bot";

        let balance = parseFloat(localStorage.getItem('userBalance')) || 0;
        let watchedAutoClaimVideos = parseInt(localStorage.getItem('watchedAutoClaimVideos')) || 0;
        let extraVideosCount = parseInt(localStorage.getItem('extraVideosCount')) || 0;
        let referralCount = parseInt(localStorage.getItem('referralCount')) || 0;
        
        const balanceDisplay = document.getElementById('balance');
        const dailyProd = document.getElementById('dailyProd');
        const extraCountText = document.getElementById('extraCountText');
        const referCountText = document.getElementById('referCountText');

        function updateUI() {
            balanceDisplay.innerText = balance.toLocaleString() + " TITUS";
            dailyProd.innerText = watchedAutoClaimVideos + "/5";
            extraCountText.innerText = extraVideosCount;
            referCountText.innerText = referralCount;
        }
        updateUI();

        // Szerződés cím másolása kattintásra
        document.getElementById('contractAddr').addEventListener('click', () => {
            const addr = document.getElementById('contractAddr').innerText;
            navigator.clipboard.writeText(addr).then(() => {
                alert("Token szerződés címe másolva: " + addr);
            });
        });

        const adsgramBlockId = "43125"; 
        
        function playAd(callback) {
            if (window.Adsgram) {
                const controller = window.Adsgram.init({ blockId: adsgramBlockId });
                controller.show().then(callback).catch(() => alert("Hirdetés megszakítva!"));
            } else { alert("Ad network loading..."); }
        }

        document.getElementById('referBtn').addEventListener('click', () => {
            referralCount++;
            localStorage.setItem('referralCount', referralCount);
            updateUI();
            const referLink = `https://t.me/${botUsername}?start=${userId}`;
            navigator.clipboard.writeText(referLink).then(() => {
                alert("Meghívó link másolva! Eddigi meghívásaid: " + referralCount);
            });
        });

        document.getElementById('infoStatusBtn').addEventListener('click', () => {
            document.getElementById('mTitle').innerText = "📊 Rendszer Státusz & Infó";
            const adsActive = window.Adsgram ? "🟢 Aktív" : "🟡 Betöltés alatt";
            document.getElementById('mText').innerHTML = `
                <b>👥 Felhasználók:</b> 1 / 2,000<br>
                <b>📌 Jelenlegi státusz:</b> 🗡️ Teszt fázis<br><br>
                <b>💎 ÉLŐ Token Keret & Készlet:</b><br>
                • Teljes: 5,000,000 token<br>
                • Tito részesedése: 2,000,000 token<br>
                • Kiosztott: 0.00 token<br>
                • Élő bányászható: 3,000,000.00 token<br><br>
                <b>⚙️ Főbb Paraméterek:</b><br>
                • Utángyártás: Nincs<br>
                • Bányászati ciklus: 6 óránként (0.02 token)<br>
                • Auto-claim: 5 valódi videó = 24h<br>
                • Ajánlás: 0.5 token/fő<br><br>
                <b>💰 Bevétel elosztás:</b><br>
                • 60% -> Likviditás<br>
                • 20% -> Égetés (Burn)<br>
                • 20% -> Fejlesztés<br><br>
                <b>🏆 VERSENY NYEREMÉNYEK:</b><br>
                1. hely: 1000 TITUS<br>
                2. hely: 500 TITUS<br>
                3. hely: 250 TITUS<br><br>
                <hr style="border:0; border-top:1px solid #333;">
                <b>Rendszer:</b> ${adsActive}<br>
                <b>Block ID:</b> ${adsgramBlockId}
            `;
            document.getElementById('legalModal').style.display = "flex";
        });

        document.getElementById('startBtn').addEventListener('click', function startAdChain() {
            const expiry = localStorage.getItem('autoClaimExpiry');
            if (expiry && Date.now() < expiry) { alert("Már aktív!"); return; }
            playAd(() => {
                watchedAutoClaimVideos++;
                localStorage.setItem('watchedAutoClaimVideos', watchedAutoClaimVideos);
                if (watchedAutoClaimVideos >= 5) {
                    localStorage.setItem('autoClaimExpiry', Date.now() + 86400000);
                    watchedAutoClaimVideos = 0;
                    alert("Sikeres aktiválás!");
                } else {
                    alert("Videó kész! Következő jön...");
                    setTimeout(startAdChain, 1000);
                }
                updateUI();
            });
        });

        document.getElementById('extraBtn').addEventListener('click', () => {
            playAd(() => {
                extraVideosCount++;
                localStorage.setItem('extraVideosCount', extraVideosCount);
                updateUI();
                alert("Köszönjük! A hirdetés bevétele a likviditási alapba került.");
            });
        });

        document.getElementById('privacyBtn').addEventListener('click', (e) => { 
            e.preventDefault();
            document.getElementById('mTitle').innerText = "Privacy Policy";
            document.getElementById('mText').innerHTML = "We do not store PII. Ads powered by AdsGram.";
            document.getElementById('legalModal').style.display = "flex";
        });
        document.getElementById('termsBtn').addEventListener('click', (e) => { 
            e.preventDefault();
            document.getElementById('mTitle').innerText = "Terms of Service";
            document.getElementById('mText').innerHTML = "Virtual assets for ranking purposes only.";
            document.getElementById('legalModal').style.display = "flex";
        });
    </script>
</body>
</html>
