<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Titus Token Bányászat</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .header {
            text-align: center;
            font-size: 13px;
            letter-spacing: 2px;
            color: #d4af37;
            font-weight: bold;
        }
        .coin-container {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffd700 0%, #b8860b 70%, #3e2723 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
            border: 3px solid #fff;
            text-align: center;
            padding: 10px;
        }
        .coin-title {
            font-size: 20px;
            font-weight: 900;
            color: #1a1a1a;
            letter-spacing: 1px;
            margin-top: 2px;
        }
        .coin-subtitle {
            font-size: 11px;
            font-weight: bold;
            color: #222;
        }
        .balance-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 14px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
        .balance-title {
            font-size: 11px;
            color: #aaa;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .balance-amount {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
        }
        .balance-usd {
            font-size: 13px;
            color: #888;
            margin-top: 2px;
        }
        .stats-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        .stat-box {
            flex: 1;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stat-icon {
            font-size: 18px;
        }
        .stat-text div:first-child {
            color: #888;
            font-size: 9px;
        }
        .stat-text div:last-child {
            font-weight: bold;
            color: #fff;
            font-size: 12px;
        }
        .buttons-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }
        .btn {
            padding: 12px;
            border-radius: 10px;
            border: none;
            color: #fff;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
        }
        .btn-green { background-color: #1b5e20; border: 1px solid #2e7d32; }
        .btn-red { background-color: #b71c1c; border: 1px solid #c62828; }
        .btn-blue { background-color: #0d47a1; border: 1px solid #1565c0; }
        .btn-dark { background-color: #212121; border: 1px solid #424242; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">TITUS TOKEN<br>BÁNYÁSZAT</div>
        
        <div class="coin-container">
            <div style="font-size: 16px;">👑</div>
            <div class="coin-title">TITUS</div>
            <div class="coin-subtitle">TOKEN</div>
            <div style="font-size: 7px; margin-top: 4px; color: #222;">PREMIUM DIGITAL ASSET</div>
        </div>

        <div class="balance-card">
            <div class="balance-title">AKTUÁLIS EGYENLEG:</div>
            <div class="balance-amount">0 TITUS</div>
            <div class="balance-usd">≈ $0.00 USD</div>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <span class="stat-icon">⚡</span>
                <div class="stat-text">
                    <div>Bányászati Sebesség:</div>
                    <div>0 MH/s</div>
                </div>
            </div>
            <div class="stat-box">
                <span class="stat-icon">📊</span>
                <div class="stat-text">
                    <div>Mai Termelés:</div>
                    <div>0 TITUS</div>
                </div>
            </div>
        </div>

        <div class="buttons-grid">
            <button class="btn btn-green" onclick="alert('Bányászat elindítva!')">
                ⛏️ Bányászat Indítása
            </button>
            <button class="btn btn-red" onclick="alert('Bányászat leállítva!')">
                ⏹️ Bányászat Leállítása
            </button>
            <button class="btn btn-blue" onclick="alert('Kifizetés igénylése elküldve!')">
                💰 Kifizetés Igénylése
            </button>
            <button class="btn btn-dark" onclick="alert('Beállítások megnyitva')">
                ⚙️ Beállítások
            </button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
